	<!-- 1. ПЕРЕХВАТ WEBSOCKET (Обязательно первым!) -->
	<script>
  (function() {
    const originalWS = window.WebSocket;
    window.WebSocket = function(url, protocols) {
      console.log('[WS OVERRIDE] Original URL:', url);

      // Твой реальный WSS-сервер на Railway
      const myWsUrl = 'wss://blockpostio-production.up.railway.app/ws';

      if (url.includes('playblockpost.com') || url.includes('85.119.149.187')) {
        url = myWsUrl;
        console.log('[WS OVERRIDE] Changed to:', url);
      }

      return new originalWS(url, protocols);
    };
  })();
</script>
