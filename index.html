	<!-- 1. Сначала — наш перехват WebSocket (ДО любых других скриптов игры) -->
	<script>
  (function() {
    const originalWS = window.WebSocket;
    window.WebSocket = function(url, protocols) {
      console.log('[WS OVERRIDE] Original URL:', url);

      // Твой реальный WSS-сервер на Railway
      const myWsUrl = 'wss://blockpostio-production.up.railway.app';

      // Подменяем только если адрес из игры (чтобы не ломать остальное)
      if (url.includes('playblockpost.com')) {
        url = myWsUrl;
        console.log('[WS OVERRIDE] Changed to:', url);
      }

      return new originalWS(url, protocols);
    };
  })();
</script>
